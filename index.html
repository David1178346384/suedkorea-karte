const regionNames={seoul:"Seoul",umland:"Umland · Tagesausflug",korea:"Südkorea · Mehrtagestour"};
const colors={seoul:"#2563eb",umland:"#059669",korea:"#dc2626"};
const categoryNames={"Palast/Geschichte":"Paläste & Geschichte","Aussicht/Natur":"Aussicht & Natur","Markt/Vintage":"Märkte & Vintage","Kultur/Viertel":"Kultur & Viertel","Nightlife/Food":"Food & Nightlife","Indoor/Relax":"Indoor & Relax"};
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([36.6,127.8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(map);
const markers=L.layerGroup().addTo(map);let markerBySpot=new Map();
const categoryFilter=document.getElementById('categoryFilter'),regionFilter=document.getElementById('regionFilter'),searchInput=document.getElementById('searchInput'),spotList=document.getElementById('spotList');
document.getElementById('totalCount').textContent=allSpots.length;
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getFiltered(){const q=searchInput.value.trim().toLocaleLowerCase('de');return allSpots.filter(s=>(categoryFilter.value==='all'||s.cat===categoryFilter.value)&&(regionFilter.value==='all'||s.reg===regionFilter.value)&&(!q||(s.name+' '+s.tip+' '+categoryNames[s.cat]+' '+regionNames[s.reg]).toLocaleLowerCase('de').includes(q)));}
function popupHTML(spot){const query=encodeURIComponent(spot.name);return '<h3>'+escapeHTML(spot.name)+'</h3><span class="popup-badge" style="background:'+colors[spot.reg]+'">'+escapeHTML(regionNames[spot.reg])+'</span><p class="popup-tip"><b>'+escapeHTML(categoryNames[spot.cat])+'</b><br>💡 '+escapeHTML(spot.tip)+'</p><a class="nav-btn" href="https://map.naver.com/p/search/'+query+'" target="_blank" rel="noopener noreferrer">📍 In Naver Map öffnen</a><p style="font-size:10px;color:#627d98;margin:8px 0 0">Koordinaten sind Orientierungspunkte; den genauen Zugang bitte prüfen.</p>';}
function focusSpot(spot){const marker=markerBySpot.get(spot);if(!marker)return;if(window.innerWidth<=700){app.classList.remove('filters-open');filtersToggle.setAttribute('aria-expanded','false');}map.setView([spot.lat,spot.lng],Math.max(map.getZoom(),14),{animate:true});marker.openPopup();}
function render(){const filtered=getFiltered();markers.clearLayers();markerBySpot.clear();spotList.innerHTML='';filtered.forEach(spot=>{const marker=L.circleMarker([spot.lat,spot.lng],{radius:7,weight:2,color:'#fff',fillColor:colors[spot.reg],fillOpacity:.95}).addTo(markers);marker.bindPopup(popupHTML(spot));markerBySpot.set(spot,marker);const btn=document.createElement('button');btn.className='spot-item';btn.type='button';btn.innerHTML='<span class="spot-name">'+escapeHTML(spot.name)+'</span><span class="spot-meta"><i class="dot" style="background:'+colors[spot.reg]+'"></i>'+escapeHTML(regionNames[spot.reg])+' · '+escapeHTML(categoryNames[spot.cat])+'</span>';btn.addEventListener('click',()=>focusSpot(spot));spotList.appendChild(btn);});document.getElementById('shownCount').textContent=filtered.length;if(!filtered.length)spotList.innerHTML='<div class="empty">Keine Treffer. Suchbegriff oder Filter ändern.</div>';if(filtered.length&&filtered.length<allSpots.length){/* keep current zoom while filtering */}else if(filtered.length===allSpots.length){fitSpots(filtered,false);} }
function fitSpots(spots,animate=true){if(!spots.length)return;const bounds=L.latLngBounds(spots.map(s=>[s.lat,s.lng]));map.fitBounds(bounds.pad(.08),{maxZoom:10,animate});}
categoryFilter.addEventListener('change',render);regionFilter.addEventListener('change',render);searchInput.addEventListener('input',render);
document.getElementById('showAllBtn').addEventListener('click',()=>fitSpots(getFiltered()));document.getElementById('resetBtn').addEventListener('click',()=>{categoryFilter.value='all';regionFilter.value='all';searchInput.value='';render();});
const app=document.getElementById('app');const filtersToggle=document.getElementById('filtersToggle');filtersToggle.addEventListener('click',()=>{const open=app.classList.toggle('filters-open');filtersToggle.setAttribute('aria-expanded',String(open));});const mapViewBtn=document.getElementById('mapViewBtn');const listViewBtn=document.getElementById('listViewBtn');function setView(view){const isMap=view==='map';if(window.innerWidth<=700){app.classList.remove('filters-open');filtersToggle.setAttribute('aria-expanded','false');}app.classList.toggle('map-mode',isMap);app.classList.toggle('list-mode',!isMap);mapViewBtn.classList.toggle('active',isMap);listViewBtn.classList.toggle('active',!isMap);mapViewBtn.setAttribute('aria-pressed',String(isMap));listViewBtn.setAttribute('aria-pressed',String(!isMap));if(isMap){setTimeout(()=>map.invalidateSize(),80);}}mapViewBtn.addEventListener('click',()=>setView('map'));listViewBtn.addEventListener('click',()=>setView('list'));setView('map');
render();fitSpots(allSpots,false);
